name: Inspect Wayback candidate pages
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archived page responses and titles
        run: python3 scripts/inspect_wayback_pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-content-review
          path: archive-content-review.csv
          if-no-files-found: warn
