name: Publish Wayback candidates
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/publish-wayback-candidates.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download prior audit CSV artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prior-audits
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("archive-audit-"))) | .id' |
          while read -r id; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "prior-audits/$id.zip" || continue
          done
      - name: Merge candidates into catalog
        run: python3 scripts/merge_wayback_candidates.py
      - name: Commit candidate links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "data: publish unverified Wayback snapshot candidates"
            git push
          fi
