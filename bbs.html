<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>★ なつかしのBBS ★ | DEAD INTERNET MUSEUM</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#070b33;color:#e8e9ff;font-family:"MS Gothic","Osaka-Mono",monospace;background-image:repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.025) 23px 24px)}.wrap{max-width:760px;margin:20px auto;padding:12px}.top{border:3px ridge #a6acc7;background:#111c64;padding:16px;text-align:center}.top h1{font-size:clamp(22px,5vw,36px);margin:0;color:#ffff66;text-shadow:2px 2px #d72570}.top a{color:#a9eeff}.blink{animation:blink 1.2s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}.bbs-panel{color:#17233b} .bbs-panel h2{color:#132e89}.bbs-panel button:disabled{opacity:.65}.bbs-status{min-height:2em}footer{text-align:center;font-size:12px;margin:20px;color:#bbc9ec}footer a{color:#a9eeff}
/* v3.0 shared guest counter and old-school BBS */
.bbs-panel{margin:15px 0;padding:13px;border:3px ridge #9a9da6;background:#efeee7;font:13px 'MS Gothic',monospace;color:#17233b}
.bbs-panel h2{margin:0 0 8px;color:#132e89;font-size:20px}.bbs-panel .bbs-meta{font-size:11px;color:#505d75}.bbs-panel label{display:block;margin:8px 0 3px;font-weight:bold}
.bbs-panel input,.bbs-panel textarea{width:100%;box-sizing:border-box;background:#fff;border:2px inset #a9a9a9;padding:7px;color:#202020;font:13px 'MS Gothic',monospace}.bbs-panel textarea{min-height:75px;resize:vertical}
.bbs-panel button{margin-top:8px;background:#d9d9d9;border:2px outset #fff;padding:5px 12px;color:#172f80;font-weight:bold;cursor:pointer}.bbs-panel button:disabled{opacity:.6;cursor:wait}
.bbs-post{padding:9px;margin:8px 0;background:#fffdf3;border:1px solid #a9a9a9;overflow-wrap:anywhere;white-space:pre-wrap}.bbs-post header{font-size:11px;color:#26478e;margin-bottom:5px}.bbs-post .bbs-reply{font-size:11px;color:#4b5e7a}.bbs-status{color:#8b2750;font-size:12px}

</style></head><body><main class="wrap"><header class="top"><h1>★ DEAD INTERNET BBS ★</h1><p class="blink">WELCOME TO OUR GUESTBOOK !!</p><a href="./index.html">◀ 博物館のトップへ戻る</a></header><section class="bbs-panel" id="bbs" aria-labelledby="bbsTitle"><h2 id="bbsTitle">★ なつかしの BBS ★</h2><p class="bbs-meta">名前を入れて書き込んでね！　※匿名投稿・管理人が不適切な投稿を非表示にする場合があります。</p><p class="bbs-status" id="bbsStatus">掲示板に接続しています…</p><form id="bbsForm"><label for="bbsName">おなまえ</label><input id="bbsName" maxlength="24" placeholder="名無しさん" required><label for="bbsMessage">メッセージ（500文字以内）</label><textarea id="bbsMessage" maxlength="500" required></textarea><button type="submit" id="bbsSubmit" >書き込む</button></form><div id="bbsPosts" aria-live="polite"></div></section></main><footer>Since 2026 · DEAD INTERNET MUSEUM · <a href="./index.html">HOME</a></footer><script>
(function(){
 const base="https://dead-internet-museum-api.inaryu070.workers.dev",counter=null,notice=null;
 const status=document.getElementById("bbsStatus"),posts=document.getElementById("bbsPosts"),form=document.getElementById("bbsForm"),send=document.getElementById("bbsSubmit");
 
 const api=(path,options={})=>fetch(base+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
 // Shared count: one counted visit per browser/network fingerprint per UTC day.
 api("/api/visits",{method:"POST"}).then(r=>{if(!r.ok)throw Error("counter");return r.json()}).then(d=>{
   if(counter&&Number.isFinite(d.count)){counter.textContent=String(d.count).padStart(7,"0");counter.title="共有訪問カウンター（概算・1日1回の重複抑制）";}
   if(d.counted&&(d.count===100||d.count===500||(d.count>=1000&&d.count%1000===0))&&notice){notice.textContent="★ キリ番 "+d.count+" GET！ ★";notice.classList.add("kiriban-hit");}
 }).catch(()=>{if(counter)counter.title="共有カウンターに接続できません";});
 async function load(){
  const r=await api("/api/posts?limit=30");if(!r.ok)throw Error("posts");const d=await r.json();
  posts.replaceChildren();
  for(const p of d.posts||[]){
   const item=document.createElement("article");item.className="bbs-post";
   const head=document.createElement("header");head.textContent="#"+p.id+"　"+p.nickname+"　"+new Date(p.created_at).toLocaleString("ja-JP");
   const body=document.createElement("div");body.textContent=p.message;item.append(head,body);
   if(p.parent_id){const reply=document.createElement("div");reply.className="bbs-reply";reply.textContent=">>"+p.parent_id+" への返信";item.append(reply);}
   posts.append(item);
  }
  status.textContent="掲示板 OPEN！　最新"+(d.posts||[]).length+"件を表示中";
 }
 load().catch(()=>{status.textContent="投稿一覧の取得に失敗しました。送信後の反映も確認できない場合があります。";});
 form.addEventListener("submit",async e=>{
  e.preventDefault();send.disabled=true;status.textContent="送信中…";
  try{
   const r=await api("/api/posts",{method:"POST",body:JSON.stringify({nickname:document.getElementById("bbsName").value,message:document.getElementById("bbsMessage").value})});
   const d=await r.json();if(!r.ok)throw Error(d.error||"投稿できませんでした");
   document.getElementById("bbsMessage").value="";await load();
  }catch(err){status.textContent=err.message||"通信エラー";}finally{send.disabled=false;}
 });
})();
</script></body></html>
