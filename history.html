<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>あの日のインターネット｜DEAD INTERNET MUSEUM</title>
<style>
:root{font-family:"MS PGothic","MS Gothic",Meiryo,sans-serif;color:#242739;background:#075b58}*{box-sizing:border-box}body{margin:0;background:radial-gradient(#ffffff18 1px,transparent 1px),linear-gradient(135deg,#0d7370,#014644);background-size:13px 13px,100% 100%;min-height:100vh}.window{max-width:940px;margin:22px auto;background:#f6f3e5;border:3px ridge #d4d8e3;box-shadow:8px 8px #002d2b;padding:0 16px 24px}.bar{background:#111d78;color:white;margin:0 -16px;padding:7px 12px;font-weight:bold;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar a{color:#fff566}h1{font-size:clamp(24px,5vw,38px);color:#111d78;margin:23px 0 4px}.subtitle{color:#565a6b;margin:0 0 22px}.controls{border:3px ridge #b7b9c3;background:#fffbe9;padding:16px;display:flex;align-items:end;flex-wrap:wrap;gap:12px}.controls label{display:grid;gap:5px;font-weight:bold}.controls select,.controls button{font:inherit;font-size:16px;padding:9px 12px;border:2px inset #bbb;background:white;min-height:43px}.controls button{cursor:pointer;border:2px outset #aaa;background:#e9e9ef;font-weight:bold}.controls button:focus-visible,.controls select:focus-visible,a:focus-visible{outline:3px solid #e53575;outline-offset:2px}.count{margin:18px 0 10px;border-bottom:2px dashed #b7b9c3;padding-bottom:8px;font-weight:bold}.results{display:grid;gap:12px}.event{background:#fff;border:1px solid #aab2c6;box-shadow:3px 3px #d2d5de;padding:13px 15px}.event h2{font-size:17px;margin:4px 0 7px;color:#1d317f}.event p{margin:7px 0;line-height:1.7}.meta{font-size:12px;color:#656a78}.event a{color:#123eaa;overflow-wrap:anywhere}.empty{padding:30px;text-align:center;background:white;border:1px dashed #aaa}.foot{font-size:12px;margin-top:22px;color:#52586a}a{color:#113c9d}@media(max-width:600px){.window{margin:0;border-left:0;border-right:0;box-shadow:none;padding:0 12px 24px}.bar{margin:0 -12px}.controls{gap:8px}.controls label{flex:1;min-width:105px}.controls select{width:100%}.controls button{flex:1}}
</style></head><body><main class="window"><div class="bar"><span>★ INTERNET HISTORY EXPLORER ★</span><a href="./index.html">← 博物館トップへ戻る</a></div><h1>あの日のインターネット</h1><p class="subtitle">★ あの月、あの日、ネットでは何が起きた？ ★</p><div class="controls"><label for="month">月<select id="month"></select></label><label for="day">日<select id="day"></select></label><button id="today" type="button">今日へ</button><button id="random" type="button">おまかせの日付</button></div><p class="count" id="count" role="status" aria-live="polite">読み込み中…</p><section class="results" id="results"></section><p class="foot">収録情報は調査時点の資料に基づきます。日付は出来事の発生日を優先し、出典へのリンクを付けています。閏年の2月29日にも対応しています。</p></main>
<script>
const month=document.getElementById('month'),day=document.getElementById('day'),results=document.getElementById('results'),count=document.getElementById('count');let events=[];
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';month.append(o)}
function pad(n){return String(n).padStart(2,'0')}
function daysInMonth(m){return new Date(2024,m,0).getDate()}
function setDayOptions(wanted){const max=daysInMonth(Number(month.value));day.replaceChildren();for(let d=1;d<=max;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'日';day.append(o)}day.value=String(Math.min(Number(wanted)||1,max))}
function selectDate(m,d){month.value=String(m);setDayOptions(d);render()}
function render(){const key=pad(month.value)+'-'+pad(day.value);const found=events.filter(e=>typeof e.date==='string'&&e.date.slice(5)===key).sort((a,b)=>a.date.localeCompare(b.date)||Number(b.importance||0)-Number(a.importance||0));count.textContent=Number(month.value)+'月'+Number(day.value)+'日：'+found.length+'件の出来事（全'+events.length+'件から検索）';results.replaceChildren();if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='この日の出来事はまだ登録されていません。';results.append(p);return}for(const e of found){const article=document.createElement('article');article.className='event';const meta=document.createElement('div');meta.className='meta';meta.textContent=e.date.slice(0,4)+'年　｜　'+(e.category||'ネット文化')+(e.region?'　｜　'+e.region:'');const h=document.createElement('h2');h.textContent=e.title||'無題';const p=document.createElement('p');p.textContent=e.summary||'';article.append(meta,h,p);if(typeof e.source==='string'&&/^https?:\/\//.test(e.source)){const a=document.createElement('a');a.href=e.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='出典を見る ↗';article.append(a)}results.append(article)}}
month.addEventListener('change',()=>{setDayOptions(day.value);render()});day.addEventListener('change',render);document.getElementById('today').addEventListener('click',()=>{const now=new Date(),parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'}).formatToParts(now);selectDate(Number(parts.find(x=>x.type==='month').value),Number(parts.find(x=>x.type==='day').value))});document.getElementById('random').addEventListener('click',()=>{const d=new Date(Date.UTC(2024,0,1)+Math.floor(Math.random()*366)*86400000);selectDate(d.getUTCMonth()+1,d.getUTCDate())});document.getElementById('today').click();
fetch('./data/internet-history.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{if(!Array.isArray(j.events))throw Error('Invalid events');events=j.events;render()}).catch(()=>{count.textContent='データを読み込めませんでした。';results.textContent='再読み込みしてお試しください。'});
</script></body></html>
