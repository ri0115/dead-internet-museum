<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理人の前略プロフィール｜DEAD INTERNET MUSEUM</title><style>body{margin:0;background:#e9e9df;color:#202020;font:14px/1.65 "MS PGothic",sans-serif}main{max-width:620px;margin:15px auto;padding:12px;background:#fff;border:3px ridge #aaa;box-shadow:5px 5px #777}header{text-align:center;background:#000080;color:#fff;padding:12px}h1{font-size:22px;margin:4px}.sub{color:#fffd66}.notice{background:#ffffdf;border:1px dashed #777;padding:9px;margin:12px 0}.q{border-bottom:1px dotted #aaa;padding:9px 5px}.q b{color:#003399}.answer{white-space:pre-wrap;overflow-wrap:anywhere;margin:3px 0 0 18px;color:#555}.q textarea{box-sizing:border-box;width:100%;min-height:60px;font:14px "MS PGothic",sans-serif;display:none}.editing .q textarea{display:block}.editing .answer{display:none}button,a.action{border:2px outset #ddd;background:#eee;padding:7px;color:#000;cursor:pointer;margin:3px}footer{text-align:center;padding:15px}#editNote{font-size:12px;color:#666}a{color:#00c}@media(max-width:650px){main{margin:5px;padding:7px}}</style></head><body><main><header><div>★ 管理人の部屋 ★</div><h1>前略プロフィール</h1><div class="sub">☆ 2000年代のプロフを再現 ☆</div></header><div class="notice">ようこそ♪ 管理人の前略プロフです。<br>全65項目を当時の順番で再現しています。未回答の項目は「ひみつ」と表示されます。</div><div><button id="edit">✎ 回答を編集</button><button id="save" hidden>保存（この端末のみ）</button><button id="export" hidden>回答JSONを書き出す</button><button id="cancel" hidden>編集を閉じる</button></div><p id="editNote">※公開ページの編集機能はこのブラウザ内のプレビュー用です。他の訪問者の画面やGitHubの内容は変更されません。公開する回答は管理者が別途サイトに反映してください。</p><section id="questions"></section><footer>★ <a href="./index.html">博物館TOPへ戻る</a> ★<p>Copyright © DEAD INTERNET MUSEUM</p></footer></main><script>const questions=["HN","HNの由来","性別","誕生日","星座","血液型","前世","住んでいるところ","生まれたところ","職業","学年","絡むーちょ","似ている芸能人","身長","体重","足のサイズ","手の長さ","趣味","特技","握力","髪型","口癖","性格","嗜好品","自慢なこと","持っている資格","使っている携帯電話","好きな男性のタイプ","好きな女性のタイプ","好きな言葉","好きな芸能人","好きな食べ物","嫌いな食べ物","好きな飲み物","嫌いな飲み物","好きな教科","嫌いな教科","好きなテレビ番組","好きな映画","好きな本","好きなスポーツ","好きな音楽","好きなブランド","愛用の香水","好きな花","好きなゲーム","愛車","将来の夢","好きな動物","休日の過ごし方","尊敬する人","今一番欲しいもの","今一番行きたいところ","今一番やりたいこと","よく使う路線","よく遊ぶところ","カラオケでよく歌う曲","初めて買ったＣＤ","マイブーム","最近ひそかに興味があること","生まれ変わったら","世界平和に必要なのは","兎に角主張したい事","疑問に思っている事","ここだけの話"];const defaults={};const key='dim-zenryaku-profile-v1';let answers={...defaults};try{answers={...answers,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}const root=document.getElementById('questions');function render(){root.replaceChildren();questions.forEach((q,i)=>{const section=document.createElement('div');section.className='q';const label=document.createElement('b');label.textContent=(i+1)+'. '+q;const p=document.createElement('p');p.className='answer';p.textContent=answers[q]||'ひみつ';const ta=document.createElement('textarea');ta.value=answers[q]||'';ta.setAttribute('aria-label',q+' の回答');section.append(label,p,ta);root.append(section)})}render();const edit=document.getElementById('edit'),save=document.getElementById('save'),ex=document.getElementById('export'),cancel=document.getElementById('cancel');function mode(on){document.body.classList.toggle('editing',on);edit.hidden=on;save.hidden=!on;ex.hidden=!on;cancel.hidden=!on}edit.onclick=()=>mode(true);cancel.onclick=()=>{render();mode(false)};save.onclick=()=>{root.querySelectorAll('textarea').forEach((t,i)=>answers[questions[i]]=t.value.trim());try{localStorage.setItem(key,JSON.stringify(answers));alert('この端末に保存しました。公開サイトのデータは変更されません。')}catch{alert('保存できませんでした。JSON書き出しをご利用ください。')}render();mode(false)};ex.onclick=()=>{root.querySelectorAll('textarea').forEach((t,i)=>answers[questions[i]]=t.value.trim());const blob=new Blob([JSON.stringify({title:'管理人の前略プロフィール',answers},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='zenryaku-profile-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></body></html>
